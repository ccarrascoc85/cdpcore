# /etc/systemd/journald.conf.d/cdpcore.conf
# Keep the journal across reboots so a hardware fault (drive stall, USB
# reset, undervoltage) can still be read after the appliance is restarted.
# Bounded so it can never fill the card: 64 MiB total, 8 MiB per file,
# compressed. Writes stay asynchronous (journald's default 5 min sync
# interval), so playback and the backend are not affected.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=30day
